# Versioning policy (nyuchi/.github#80): every merge into `staging` is
# released as the next PATCH, tagged on the merged commit (v0.1.1, v0.1.2, ...).
#
# The tag is what lets a release PR carry the version files from staging: a
# version that is already tagged passes release-version-check on main as
# "already tagged", and main-release.yml then tags the main release as the
# next MINOR above it. Without these tags the files deadlock: staging accepts
# only the next patch, main only the next minor (#22).
name: Staging version

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      bump:
        description: Override the bump (major is only ever manual).
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  version:
    uses: nyuchi/.github/.github/workflows/reusable-staging-release.yml@925d067322defd676dacd90f2c2b0540cb10f644  # v0.11.1
    with:
      bump: ${{ inputs.bump || '' }}
    permissions:
      contents: write
