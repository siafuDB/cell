name: Bug or a cell that breaks the validator
description: The validator, the CLI or the library does the wrong thing.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A cell that the validator gets wrong is the most useful report there is. For a security
        problem, do not file here: use SECURITY.md.
  - type: textarea
    id: cell
    attributes:
      label: The cell or command
      description: The smallest cell, and the command, that shows the problem.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The output and the exit code.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `cell version`, or the commit.
